id: pipeline-evenements-initial
namespace: pulsevents
description: Import initial (manuel) des evenements Open Agenda vers Qdrant

tasks:
  - id: fetch_events
    type: io.kestra.plugin.docker.Run
    containerImage: pulsevents-backend:latest
    networkMode: pulsevents_default
    volumes:
      - pulsevents_kestra_pipeline_data:/app/data
    commands:
      - sh
      - -c
      - "cd /app && python -m pipeline.fetch_last_events"
    env:
      MISTRAL_API_KEY: "{{ secret('MISTRAL_API_KEY') }}"
      OPEN_AGENDA_KEY: "{{ secret('OPEN_AGENDA_KEY') }}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pulsevent
      POSTGRES_USER: pulsevent_user
      POSTGRES_PASSWORD: "{{ secret('POSTGRES_PASSWORD') }}"
      QDRANT_HOST: qdrant

  - id: load_bronze
    type: io.kestra.plugin.docker.Run
    containerImage: pulsevents-backend:latest
    networkMode: pulsevents_default
    volumes:
      - pulsevents_kestra_pipeline_data:/app/data
    commands:
      - sh
      - -c
      - "cd /app && python -m pipeline.load_bronze"
    env:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pulsevent
      POSTGRES_USER: pulsevent_user
      POSTGRES_PASSWORD: "{{ secret('POSTGRES_PASSWORD') }}"

  - id: transform_gold
    type: io.kestra.plugin.docker.Run
    containerImage: pulsevents-backend:latest
    networkMode: pulsevents_default
    volumes:
      - pulsevents_kestra_pipeline_data:/app/data
    commands:
      - sh
      - -c
      - "cd /app && python -m pipeline.transform_gold"
    env:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pulsevent
      POSTGRES_USER: pulsevent_user
      POSTGRES_PASSWORD: "{{ secret('POSTGRES_PASSWORD') }}"

  - id: load_gold
    type: io.kestra.plugin.docker.Run
    containerImage: pulsevents-backend:latest
    networkMode: pulsevents_default
    volumes:
      - pulsevents_kestra_pipeline_data:/app/data
    commands:
      - sh
      - -c
      - "cd /app && python -m pipeline.load_gold"
    env:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pulsevent
      POSTGRES_USER: pulsevent_user
      POSTGRES_PASSWORD: "{{ secret('POSTGRES_PASSWORD') }}"

  - id: send_gold_to_qdrant
    type: io.kestra.plugin.docker.Run
    containerImage: pulsevents-backend:latest
    networkMode: pulsevents_default
    volumes:
      - pulsevents_kestra_pipeline_data:/app/data
    commands:
      - sh
      - -c
      - "cd /app && python -m pipeline.send_gold_to_qdrant"
    env:
      MISTRAL_API_KEY: "{{ secret('MISTRAL_API_KEY') }}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pulsevent
      POSTGRES_USER: pulsevent_user
      POSTGRES_PASSWORD: "{{ secret('POSTGRES_PASSWORD') }}"
      QDRANT_HOST: qdrant